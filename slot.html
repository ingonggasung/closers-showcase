<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>코스튬 상세 - 클로저스 캐릭터 자랑</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <a href="#" id="back-link" class="back-link">&larr; 캐릭터로 돌아가기</a>

  <input type="text" id="slot-title" class="slot-title-input" placeholder="세트 이름" />

  <div class="section-head">
    <h2>사진 (최대 10장)</h2>
  </div>
  <div class="image-row" id="image-row"></div>
  <input type="file" id="image-input" accept="image/*" multiple hidden />

  <div class="section-head">
    <h2>코스튬 상세 정보</h2>
  </div>
  <div class="detail-panel">
    <label>어떤 코스튬을 착용했는지 자유롭게 적어주세요 (예: 상의, 하의, 헤어, 악세서리 등)</label>
    <textarea id="description" placeholder="예) 상의: 여름 이벤트 셔츠&#10;하의: 화이트 스커트&#10;헤어: 기본 헤어 + 리본 악세서리"></textarea>
    <div class="save-row">
      <button class="pill accent" id="save-desc">저장</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/slot.js"></script>
</body>
</html>
