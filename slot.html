<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>코스튬 상세 - 클로저스 캐릭터 자랑</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="top-bar">
    <a href="#" id="back-link" class="back-link">&larr; 캐릭터로 돌아가기</a>
    <div id="auth-bar"></div>
  </div>

  <div id="slot-title-area"></div>
  <div class="char-owner" id="slot-owner"></div>

  <div class="section-head">
    <h2>사진 (최대 10장)</h2>
  </div>
  <div class="image-row" id="image-row"></div>
  <input type="file" id="image-input" accept="image/*" multiple hidden />

  <div class="section-head">
    <h2>코스튬 상세 정보</h2>
  </div>
  <div class="detail-panel" id="detail-panel"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/slot.js"></script>
</body>
</html>
