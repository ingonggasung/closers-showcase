<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Closers Showcase</title>
<link rel="icon" id="favicon-link" href="" />
<link rel="stylesheet" href="css/style.css?v=123" />
</head>
<body>

<div class="landing">
  <img class="landing-art left" alt="" />
  <img class="landing-art right" alt="" />
  <script>
    // One of the two art pairs per visit. src is set here rather than in the
    // markup so only the chosen pair is ever downloaded.
    var pair = Math.random() < .5 ? ['tris', 'yuria'] : ['eunha', 'mirae'];
    ['left', 'right'].forEach(function (side, i) {
      var el = document.querySelector('.landing-art.' + side);
      el.src = 'img/' + pair[i] + '.webp?v=123';
      el.classList.add(pair[i]);  // per-artwork size tweaks live in the CSS
    });
  </script>
  <div class="landing-center">
    <h1 class="landing-title">
      <span class="landing-word-1">Closers</span><br />
      <span class="landing-word-2 accent-part">Showcase</span>
    </h1>
    <a class="pill accent landing-enter" href="posts.html">게시글 보러가기</a>
  </div>

  <footer class="landing-footer">
    <p>오류·건의·문의 : nasac0311@gmail.com</p>
    <p>
      본 사이트는 나딕게임즈가 서비스하는 「클로저스」의 비공식 팬사이트이며,
      나딕게임즈와 제휴 관계가 없습니다.
    </p>
    <p class="landing-copyright">
      All game images and character illustrations are trademarks and copyrights of
      NADDIC GAMES Co., Ltd. All rights reserved.
    </p>
  </footer>
</div>

<script src="js/i18n.js?v=123"></script>
</body>
</html>
