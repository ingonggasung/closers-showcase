<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>클로저스 캐릭터 자랑</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="top-bar">
    <h1>필터</h1>
    <button class="pill" id="reset-all">전체 초기화</button>
  </div>

  <div class="section-head">
    <h2>캐릭터</h2>
    <div class="section-actions">
      <input type="text" id="char-search" class="search-input" placeholder="캐릭터 검색" />
      <button class="pill" id="reset-char">초기화</button>
    </div>
  </div>

  <div class="char-grid" id="char-grid"></div>
</div>

<div class="modal-overlay" id="char-modal" hidden>
  <div class="modal-box">
    <h3>캐릭터 추가</h3>
    <label>캐릭터 이름</label>
    <input type="text" id="char-name-input" placeholder="예: 서유리" />
    <label>아이콘 이미지</label>
    <input type="file" id="char-icon-input" accept="image/*" />
    <img class="icon-preview" id="char-icon-preview" />
    <div class="modal-actions">
      <button class="pill" id="char-cancel">취소</button>
      <button class="pill accent" id="char-save">추가</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/dnd.js"></script>
<script src="js/index.js"></script>
</body>
</html>
