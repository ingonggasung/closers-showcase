<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캐릭터 상세 - 클로저스 캐릭터 자랑</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <div class="top-bar">
    <a href="index.html" class="back-link">&larr; 캐릭터 목록</a>
    <div id="auth-bar"></div>
  </div>

  <div class="char-title">
    <img id="char-icon" alt="" />
    <h1 id="char-name">캐릭터</h1>
  </div>

  <div class="section-head">
    <h2>코스튬 게시글</h2>
    <div class="section-actions">
      <input type="text" id="slot-search" class="search-input" placeholder="게시글 검색" />
    </div>
  </div>

  <div class="slot-grid" id="slot-grid"></div>
</div>

<div class="modal-overlay" id="post-modal" hidden>
  <div class="modal-box modal-box-wide">
    <h3>코스튬 등록</h3>

    <label>제목</label>
    <input type="text" id="post-title" maxlength="60" placeholder="예: 여름 이벤트 코스튬" />

    <label>캐릭터 선택</label>
    <select id="post-character"></select>

    <label>사진 (최대 10장)</label>
    <input type="file" id="post-images" accept="image/*" multiple />
    <div class="post-image-preview" id="post-image-preview"></div>

    <label>코스튬</label>
    <div id="post-costume-fields"></div>

    <label>악세서리</label>
    <div id="post-accessory-fields"></div>

    <div class="field-label-row">
      <label>메모 (염색 코드 등)</label>
      <span id="post-notes-count">0/200</span>
    </div>
    <textarea id="post-notes" maxlength="200" rows="3"></textarea>

    <div class="modal-actions">
      <button class="pill" id="post-cancel">취소</button>
      <button class="pill accent" id="post-submit">등록</button>
    </div>
  </div>
</div>

<button class="fab" id="global-fab" hidden title="코스튬 등록">+</button>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/dnd.js"></script>
<script src="js/context-menu.js"></script>
<script src="js/slot-card.js"></script>
<script src="js/post-modal.js"></script>
<script src="js/character.js"></script>
</body>
</html>
