<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캐릭터 상세 - 클로저스 캐릭터 자랑</title>
<link rel="icon" id="favicon-link" href="" />
<link rel="stylesheet" href="css/style.css?v=105" />
</head>
<body>

<div class="page">
  <div class="sticky-header">
    <div class="top-bar">
      <div class="top-bar-left">
        <a href="posts.html" class="back-link">&larr; 캐릭터 목록</a>
        <a href="posts.html" class="site-title">Closers Showcase</a>
      </div>
      <div id="auth-bar"></div>
    </div>
  </div>

  <a href="posts.html" class="sidebar-brand">Closers<br><span class="accent-part">Showcase</span></a>

  <div class="char-title">
    <img id="char-icon" alt="" />
    <h1 id="char-name">캐릭터</h1>
  </div>

  <div class="section-head">
    <h2>코스튬 게시글</h2>
    <div class="section-actions">
      <select id="slot-search-field" class="search-field-select">
        <option value="title">제목명</option>
        <option value="author">게시자명</option>
        <option value="costume">코스튬명</option>
      </select>
      <input type="text" id="slot-search" class="search-input" placeholder="게시글 검색" />
    </div>
  </div>

  <div class="slot-grid" id="slot-grid"></div>
</div>

<div class="modal-overlay" id="post-modal" hidden>
  <div class="modal-box modal-box-wide">
    <h3>코스튬 등록</h3>

    <label>제목</label>
    <input type="text" id="post-title" maxlength="60" placeholder="예: 여름 이벤트 코스튬" />

    <label>캐릭터 선택</label>
    <select id="post-character"></select>

    <label>사진 (최대 10장)</label>
    <input type="file" id="post-images" accept="image/*" multiple />
    <label class="pill file-btn" for="post-images">사진 선택</label>
    <div class="post-image-preview" id="post-image-preview"></div>

    <label>코스튬</label>
    <div id="post-costume-fields"></div>

    <label>악세서리</label>
    <div id="post-accessory-fields"></div>

    <div class="field-label-row">
      <label>메모 (염색 코드 등)</label>
      <span id="post-notes-count">0/200</span>
    </div>
    <textarea id="post-notes" maxlength="200" rows="3"></textarea>

    <div class="modal-actions">
      <button class="pill" id="post-cancel">취소</button>
      <button class="pill accent" id="post-submit">등록</button>
    </div>
  </div>
</div>

<button class="scroll-top-btn" id="scroll-top-btn" hidden title="맨 위로">&uarr;</button>
<button class="fab" id="global-fab" hidden title="코스튬 등록">+</button>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=105"></script>
<script src="js/utils.js?v=105"></script>
<script src="js/auth.js?v=105"></script>
<script src="js/db.js?v=105"></script>
<script src="js/dnd.js?v=105"></script>
<script src="js/train-panel.js?v=105"></script>
<script src="js/review-log.js?v=105"></script>
<script src="js/context-menu.js?v=105"></script>
<script src="js/slot-card.js?v=105"></script>
<script src="js/post-modal.js?v=105"></script>
<script src="js/character.js?v=105"></script>
</body>
</html>
