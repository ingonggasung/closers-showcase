<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캐릭터 상세 - 클로저스 캐릭터 자랑</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="page">
  <a href="index.html" class="back-link">&larr; 캐릭터 목록</a>

  <div class="char-title">
    <img id="char-icon" alt="" />
    <h1 id="char-name">캐릭터</h1>
  </div>

  <div class="section-head">
    <h2>코스튬 세트</h2>
    <div class="section-actions">
      <input type="text" id="slot-search" class="search-input" placeholder="세트 검색" />
    </div>
  </div>

  <div class="slot-grid" id="slot-grid"></div>
</div>

<div class="modal-overlay" id="slot-modal" hidden>
  <div class="modal-box">
    <h3>코스튬 세트 추가</h3>
    <label>세트 이름</label>
    <input type="text" id="slot-title-input" placeholder="예: 여름 이벤트 코스튬" />
    <div class="modal-actions">
      <button class="pill" id="slot-cancel">취소</button>
      <button class="pill accent" id="slot-save">추가</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/dnd.js"></script>
<script src="js/character.js"></script>
</body>
</html>
